        summary: A 500+ person IT consulting and services firm. Mandate to build new revenue streams and strategic partnerships, reporting to senior leadership.
        highlights:
          - Scaled the LinkedIn Sales Solutions partnership from zero to INR 1 Crore across 8 enterprise deals in under four months (Dec 2025 to Mar 2026), the fastest-growing partnership in company history.
          - Built the commercial engine end to end, from lead qualification and deal structuring to Center of Excellence onboarding and renewals, executed across 60+ enterprise accounts in BFSI, manufacturing, hospitality, media and technology.
          - Aligned seven stakeholder groups on every deal (Finance, Pre-Sales, Sales, the executive team, LinkedIn account executives and partner leads, customer sponsors) and managed multi-currency billing in INR, USD and LKR.
          - Launched a four-city GTM series in Gurugram, Noida, Mumbai and Bangalore, engaging 25+ enterprise stakeholders at the flagship event and generating qualified pipeline.
          - Authored the partnership commercialization playbook, adopted by senior leadership as the institutional template for scaling future OEM alliances.
          - Established the B2B revenue infrastructure from zero (LinkedIn Sales Navigator, HubSpot SalesHub, Apollo.io, reusable sequences and cadences) and secured executive approval for the investment with an ROI-backed business case.
          - Serve as single point of contact for five OEM alliances (Cast AI, MongoDB, Oracle, Anaplan, Harness), with a weekly pipeline report to senior leadership and a master account-mapping repository.
          - Built MongoDB pipeline across Fujifilm, DMI Finance, Maruti and Renew Energy and proposed expansion into the US and UK; co-authored the Anaplan 3-month and 6-month practice-building plan and supported the NEC vendor empanelment.
          - Launched a Global Capability Centers market-entry initiative with service offerings and evaluation frameworks.

